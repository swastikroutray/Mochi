[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doompets"
version = "0.4.0"
description = "An open-source desktop pet that reacts to your computer habits."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7",
]

[project.scripts]
doompet = "doompets.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/doompets"]
